name: Dnevni cjenik snapshot

# Ovaj workflow svaki dan (i bez ikakvih promjena cijena) sprema novi
# CSV snapshot trenutnog cjenika u data/archive/, briše zapise starije
# od 30 dana i ažurira data/manifest.json koji stranica čita.
#
# Ime datoteke prati fiksni obrazac: poslovnica-savska1-1-01-{timestamp}.csv
# Mijenja se samo timestamp, prefiks (naziv poslovnice i broj) ostaje isti.
#
# ZAŠTO 00:07 UTC (ubrzo iza ponoći), a ne "oko 8"?
# Nema razloga gađati blizu roka. Pokretanjem odmah iza ponoći (00:07 UTC =
# 02:07 CEST ljeti / 01:07 CET zimi) dobivamo ~6-7 sati sigurnosne rezerve
# prije 08:00 po hrvatskom vremenu, umjesto da se oslanjamo na to da
# GitHub Actions cron opali točno na vrijeme. Biramo ne-standardno vrijeme
# da ne "upadnemo" u često korišteno vrijeme i padnemo u red čekanja.
#
# NAPOMENA O POUZDANOSTI: GitHub Actions `schedule` NIJE jamčeno točan do
# minute — u praksi zna kasniti i po nekoliko sati, pogotovo na javnim/
# besplatnim repozitorijima gdje scheduled jobovi imaju niži prioritet.

on:
  schedule:
    - cron: "07 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi repozitorij
        uses: actions/checkout@v4

      - name: Kreiraj dnevni snapshot cjenika (preskoči ako već postoji za danas)
        run: |
          TODAY=$(date -u +%Y%m%d)
          mkdir -p data/archive
          if ls data/archive/poslovnica-savska1-1-01-${TODAY}*.csv 1> /dev/null 2>&1; then
            echo "Snapshot za danas ($TODAY) već postoji, preskačem stvaranje novog."
          else
            TS=$(date -u +%Y%m%d%H%M%S)
            FNAME="data/archive/poslovnica-savska1-1-01-${TS}.csv"
            cp data/izvor-cijena.csv "$FNAME"
            echo "Snapshot spremljen: $FNAME"
          fi

      - name: Ažuriraj manifest i obriši stare zapise (30 dana)
        run: python3 scripts/build_manifest.py

      - name: Commitaj i pushaj promjene
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/archive data/manifest.json
          if git diff --cached --quiet; then
            echo "Nema promjena za commit."
          else
            git commit -m "Dnevni cjenik snapshot $(date -u +%F)"
            git push
          fi
